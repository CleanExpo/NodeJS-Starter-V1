# Alembic Configuration — NodeJS-Starter-V1 Backend
# Run migrations: uv run alembic upgrade head
# Generate new: uv run alembic revision --autogenerate -m "description"
# Stamp current: uv run alembic stamp head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql://starter_user:local_dev_password@localhost:5433/starter_db

# Override via DATABASE_URL env var in production — see alembic/env.py

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
