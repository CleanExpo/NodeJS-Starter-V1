name: error-handling
category: backend
description: 'Validates error handling patterns follow error taxonomy'
version: '1.0.0'

cases:
  - id: no-bare-except
    description: 'No bare except clauses — always catch specific exceptions'
    rule: no_bare_except
    forbidden_pattern: 'except:'
    allowed: 'except SpecificException as e:'

  - id: structured-logging-errors
    description: 'All exceptions are logged with structured context'
    rule: exception_logged_with_context
    required_fields: [error_type, message, trace_id]

  - id: no-swallowed-errors
    description: 'Errors are never silently swallowed'
    rule: no_empty_except_blocks
    forbidden: 'except Exception: pass'

  - id: http-status-codes-correct
    description: 'HTTP status codes match error semantics'
    rule: status_code_semantics
    mappings:
      400: 'validation error'
      401: 'unauthenticated'
      403: 'unauthorised'
      404: 'not found'
      409: 'conflict'
      422: 'unprocessable entity'
      429: 'rate limited'
      500: 'internal server error'
