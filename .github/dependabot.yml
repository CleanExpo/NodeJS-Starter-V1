version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Brisbane
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Brisbane
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Brisbane
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
