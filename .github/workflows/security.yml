name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security scans on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  snyk-frontend:
    name: Snyk Frontend Security Scan (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=apps/web/package.json

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-frontend-report
          path: snyk-report.json
          retention-days: 30

  snyk-backend:
    name: Snyk Backend Security Scan (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.SNYK_ENABLED == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync

      - name: Run Snyk to check Python dependencies
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=apps/backend/pyproject.toml

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-backend-report
          path: snyk-report.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, LGPL-3.0

  # npm's classic audit endpoint is retired (HTTP 410) and pnpm audit still
  # calls it, so the lockfile is scanned against Google's OSV database
  # instead. Gate matches the old --audit-level=critical semantics: fail only
  # on CVSS >= 9.0. Full findings (all severities) ship as an artifact.
  npm-audit:
    name: OSV Audit (critical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan lockfile against OSV
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest \
            scan --format json --lockfile /src/pnpm-lock.yaml > osv-report.json || true

      - name: Fail on critical vulnerabilities (CVSS >= 9.0)
        run: |
          python3 - << 'PYGATE'
          import json, sys
          with open('osv-report.json') as f:
              data = json.load(f)
          criticals = []
          for result in data.get('results', []):
              for pkg in result.get('packages', []):
                  name = pkg['package']['name']
                  version = pkg['package']['version']
                  for group in pkg.get('groups', []):
                      severity = float(group.get('max_severity') or 0)
                      if severity >= 9.0:
                          criticals.append(f'{name}@{version} CVSS={severity}')
          if criticals:
              print('CRITICAL vulnerabilities found:')
              for c in criticals:
                  print(' ', c)
              sys.exit(1)
          print('No critical (CVSS >= 9.0) vulnerabilities in the lockfile.')
          PYGATE

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-audit-report
          path: osv-report.json
          retention-days: 30

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [npm-audit, trivy-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Display security scan results
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Required Scans Completed:" >> $GITHUB_STEP_SUMMARY
          echo "- [PASS] OSV Audit (no token required)" >> $GITHUB_STEP_SUMMARY
          echo "- [PASS] Trivy Container Scan (no token required)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Optional Scans:" >> $GITHUB_STEP_SUMMARY
          echo "- [OPT] Snyk Security Scans (requires SNYK_TOKEN secret)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required security scans completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "Please review the artifact reports for detailed findings." >> $GITHUB_STEP_SUMMARY
